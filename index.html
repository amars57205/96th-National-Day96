<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>الاحتفال باليوم الوطني السعودي - الشريط السينمائي الفاخر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #006C35;
            --dark-green: #004d25;
            --accent-gold: #D4AF37;
            --bg-dark: #0b130f;
            --text-light: #f4f6f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 20%, #0f2619 0%, var(--bg-dark) 80%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            text-align: center;
            padding: 25px 15px 10px;
            position: relative;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(0, 108, 53, 0.6);
            letter-spacing: 0.5px;
            line-height: 1.3;
        }

        header p {
            font-size: 1.1rem;
            color: #a3b8ad;
            font-weight: 300;
        }

        .divider {
            width: 180px;
            height: 3px;
            background: linear-gradient(to right, transparent, var(--accent-gold), transparent);
            margin: 12px auto;
        }

        /* حاوية الشريط السينمائي المتحرك */
        .cinema-track-container {
            width: 100%;
            overflow: hidden;
            position: relative;
            padding: 50px 0;
            background: rgba(0, 0, 0, 0.5);
            border-top: 3px solid rgba(212, 175, 55, 0.3);
            border-bottom: 3px solid rgba(212, 175, 55, 0.3);
            box-shadow: inset 0 0 60px rgba(0,0,0,0.95);
            margin: auto 0;
        }

        /* إطارات شريط الفيلم السينمائي الجانبية */
        .cinema-track-container::before,
        .cinema-track-container::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 18px;
            background-image: repeating-linear-gradient(90deg, #111, #111 25px, var(--accent-gold) 25px, var(--accent-gold) 40px);
            z-index: 10;
        }
        .cinema-track-container::before { top: 0; }
        .cinema-track-container::after { bottom: 0; }

        .cinema-track {
            display: flex;
            gap: 30px;
            width: max-content;
            direction: ltr;
            animation: none;
        }

        /* سرعة العرض تحسب تلقائياً حسب عدد الصور */
        .cinema-track.running {
            animation: scrollCinemaSlow var(--duration, 500s) linear infinite;
