<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- حماية متقدمة ضد الـ XSS وحقن الأكواد -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';">
    <title>الاحتفال باليوم الوطني السعودي - الشريط السينمائي الفاخر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #006C35;
            --dark-green: #004d25;
            --accent-gold: #D4AF37;
            --bg-dark: #0b130f;
            --text-light: #f4f6f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 20%, #0f2619 0%, var(--bg-dark) 80%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            text-align: center;
            padding: 30px 15px 15px;
            position: relative;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(0, 108, 53, 0.6);
            letter-spacing: 0.5px;
            line-height: 1.3;
        }

        header p {
            font-size: 1.1rem;
            color: #a3b8ad;
            font-weight: 300;
        }

        .divider {
            width: 180px;
            height: 3px;
            background: linear-gradient(to right, transparent, var(--accent-gold), transparent);
            margin: 15px auto;
        }

        /* حاوية الشريط السينمائي المتحرك */
        .cinema-track-container {
            width: 100%;
            overflow: hidden;
            position: relative;
            padding: 50px 0;
            background: rgba(0, 0, 0, 0.5);
            border-top: 3px solid rgba(212, 175, 55, 0.3);
            border-bottom: 3px solid rgba(212, 175, 55, 0.3);
            box-shadow: inset 0 0 60px rgba(0,0,0,0.95);
            margin: auto 0;
        }

        /* إطارات شريط الفيلم السينمائي الجانبية */
        .cinema-track-container::before,
        .cinema-track-container::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 18px;
            background-image: repeating-linear-gradient(90deg, #111, #111 25px, var(--accent-gold) 25px, var(--accent-gold) 40px);
            z-index: 10;
        }
        .cinema-track-container::before { top: 0; }
        .cinema-track-container::after { bottom: 0; }

        .cinema-track {
            display: flex;
            gap: 30px;
            width: max-content;
            /* تبدأ الحركة تلقائياً وتتحرك من اليمين إلى اليسار بسرع 500 ثانية */
            animation: scrollRightToLeft 500s linear infinite; 
        }

        /* إيقاف الحركة تماماً عند وضع الماوس على الشريط ككل أو على العناصر */
        .cinema-track-container:hover .cinema-track {
            animation-play-state: paused; 
        }

        /* أبعاد كل عنصر عرض */
        .cinema-item {
            width: 520px;
            height: 350px;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.85), 0 0 20px rgba(0, 108, 53, 0.5);
            border: 2px solid rgba(212, 175, 55, 0.5);
            position: relative;
            flex-shrink: 0;
            transition: transform 0.4s ease, border-color 0.4s ease;
        }

        .cinema-item:hover {
            transform: scale(1.04) translateY(-6px);
            border-color: var(--accent-gold);
            box-shadow: 0 20px 50px rgba(0, 108, 53, 0.7), 0 0 30px rgba(212, 175, 55, 0.7);
        }

        .cinema-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cinema-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95), transparent);
            padding: 25px 20px 12px;
            text-align: center;
            font-size: 1.1rem;
            color: #fff;
            font-weight: 700;
            text-shadow: 0 2px 5px rgba(0,0,0,0.9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* حركة خروج الصور من اليمين إلى اليسار بسلاسة تامة */
        @keyframes scrollRightToLeft {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        .loading-state {
            text-align: center;
            padding: 80px;
            font-size: 1.4rem;
            color: var(--accent-gold);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #6b8277;
            font-size: 0.95rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        /* التوافقية التامة مع الشاشات المتنوعة والجوالات الذكية */
        @media screen and (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }
            header p {
                font-size: 0.95rem;
            }
            .cinema-item {
                width: 320px;
                height: 220px;
            }
        }

        @media screen and (max-width: 480px) {
            header h1 {
                font-size: 1.4rem;
            }
            .cinema-item {
                width: 260px;
                height: 180px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>الاحتفال باليوم الوطني السعودي بمدرسة عمار بن ياسر الابتدائية</h1>
        <p>نحلم ونحقق - الشريط السينمائي الهادئ</p>
        <div class="divider"></div>
    </header>

    <div id="loading" class="loading-state">جاري تجهيز الشريط السينمائي وتحميل الصور...</div>

    <div class="cinema-track-container" id="cinemaContainer" style="display: none;">
        <div class="cinema-track" id="cinemaTrack">
            <!-- ستعبأ الصور تلقائياً هنا بأمان تام ضد الثغرات -->
        </div>
    </div>

    <footer>
        تصميم وبرمجة أ.صلاح سعد الرحيمان
    </footer>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwENIhPw3eEuZA9NJ-3VVu1N-0SFVdv9a7RQDnDvYBw8TYDUdeU5ZAKDs69i-b8zwlHhw/exec';

        // دالة تعقيم النصوص ضد ثغرات الـ XSS وحقن الأكواد الخبيثة
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }

        // التحقق من صحة الروابط لضمان الأمان
        function isValidUrl(url) {
            try {
                const parsed = new URL(url);
                return parsed.protocol === 'https:' || parsed.protocol === 'http:';
            } catch (_) {
                return false;
            }
        }

        async function initCinema() {
            try {
                const response = await fetch(WEB_APP_URL);
                const imagesData = await response.json();
                
                document.getElementById('loading').style.display = 'none';

                if (!Array.isArray(imagesData) || imagesData.length === 0) {
                    document.getElementById('cinemaContainer').style.display = 'block';
                    document.getElementById('cinemaTrack').innerHTML = '<div style="color:#fff; text-align:center; padding:50px; width:100%;">لا توجد صور في المجلد حالياً.</div>';
                    return;
                }

                document.getElementById('cinemaContainer').style.display = 'block';
                
                const track = document.getElementById('cinemaTrack');
                track.innerHTML = '';

                // تكرار الصور مرتين لضمان استمرارية التمرير بشكل دائري بلا انقطاع
                let repeatedImages = [...imagesData, ...imagesData];

                repeatedImages.forEach(img => {
                    if (!img || !img.url || !isValidUrl(img.url)) return;

                    const rawName = img.name ? img.name.replace(/\.[^/.]+$/, "") : "صورة احتفالية";
                    const safeName = escapeHtml(rawName);
                    const safeUrl = encodeURI(img.url);

                    const item = document.createElement('div');
                    item.className = 'cinema-item';
                    item.innerHTML = `
                        <img src="${safeUrl}" alt="${safeName}" loading="lazy">
                        <div class="cinema-caption">${safeName}</div>
                    `;
                    track.appendChild(item);
                });

            } catch (error) {
                document.getElementById('loading').innerText = 'حدث خطأ في تحميل الصور. تأكد من إعدادات النشر لـ Google Apps Script.';
                console.error("Security/Network Error Caught Safely");
            }
        }

        initCinema();
    </script>
</body>
</html>
